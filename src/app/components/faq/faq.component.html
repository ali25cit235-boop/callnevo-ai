<section
  id="faq"
  class="faq-section section-padding"
  aria-labelledby="faq-section-title">
  <div class="container">
    <!-- Section Header -->
    <div class="section-header">
      <div class="eyebrow-badge">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span>FREQUENTLY ASKED QUESTIONS</span>
      </div>
      <h2 id="faq-section-title" class="section-title">
        Clear Answers About
        <span class="text-gradient">CALLNIVO AI.</span>
      </h2>
      <p class="section-subtitle">
        Everything you need to know about how our AI receptionists support customer calls, appointment intake, and everyday team workflows.
      </p>
    </div>

    <!-- Smooth Animated Accordion -->
    <div class="faq-accordion">
      @for (item of faqs; track item.id; let idx = $index) {
        <div
          class="faq-item glass-panel"
          [class.is-open]="openId() === item.id">
          <h3 class="faq-question-heading">
            <button
              type="button"
              class="faq-trigger"
              [id]="'faq-btn-' + item.id"
              [attr.aria-expanded]="openId() === item.id"
              [attr.aria-controls]="'faq-panel-' + item.id"
              (click)="toggleItem(item.id)">
              <span class="q-index">0{{ idx + 1 }}</span>
              <span class="q-text">{{ item.question }}</span>
              <span class="q-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <line x1="12" y1="5" x2="12" y2="19" class="v-line" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
              </span>
            </button>
          </h3>

          <div
            [id]="'faq-panel-' + item.id"
            class="faq-answer-wrapper"
            role="region"
            [attr.aria-labelledby]="'faq-btn-' + item.id">
            <div class="faq-answer-inner">
              <p>{{ item.answer }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
